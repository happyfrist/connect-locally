name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Convex bindings are committed
        run: |
          if [ ! -f src/convex/_generated/api.d.ts ]; then
            echo "::error::Convex bindings are missing. Run 'bunx convex dev --once' and commit src/convex/_generated."
            exit 1
          fi

      - name: Typecheck
        run: bunx tsc -b --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit and backend tests
        run: bun run test:all
